
name: Java CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Display staging configuration
        run: |
          echo "Deployment target: ${{ vars.DEPLOY_REGION }}"

      - name: Build and run tests
        run: mvn -B test
